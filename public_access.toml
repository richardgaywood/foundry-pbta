# Configure Rolls
rollFormula = "2d6"
rollShifting = true

# Define roll result ranges.
[rollResults]
[rollResults.crit]
range = "12+"
label = "Critical Success!"
[rollResults.success]
range = "10-11"
label = "Success!"
[rollResults.partial]
range = "7-9"
label = "Partial success"
[rollResults.failure]
range = "6-"
label = "Miss..."

########################################
## CHARACTERS ##########################
########################################
# Define the character group.
[character]
  label = "Latchkeys"

# Define stats.
[character.stats]
vitality = "Vitality"
composure = "Composure"
reason = "Reason"
presence = "Presence"
sensitivity = "Sensitivity"

[character.description.style]
  label = "Style"
  value = """
    <p><strong>xxx</strong></p>
    <p><em>pick one or make up your own: TJ Maxximalist, Cargo shorts and Triforce t-shirt, None More Goth, Williamsburg Warrior, 
    Popped Collar Princeling, All the Scarves, I'm Too Emo for My Face, Livestrong, Bootcut & Boogie, Hoodie Under Blazer, 
    Matching Sneakers</em></p>"""
[character.description.takesyouback]
  label = "Takes You Back"
  value = """
  <ol>
    <li>
        <p></p>
    </li>
    <li>
        <p></p>
    </li>
    <li>
        <p></p>
    </li>
</ol>
<p></p>
<p><em>pick three or make up your own: Girl Talk: A Game of Truth or Dare, The Konami Code, The Oregon Trail, BOOK IT!, 
Double Dare, prank phone calls, Garbage Pail Kids, M.U.S.C.L.E., Rogue, The Baby-Sitters Club, My Buddy/Kid Sister, 
Jean-Claude Van Damme, Duck Tales ("00-oo!"), reading sleepovers, You Can't Do That On Television, Huffy 10-speed, 
heading home when the streetlights flickered on, Friday the 13th: The Series, proton packs, Artax in the Swamp of Sadness, 
Waco, "A very special episode," Fangoria, mixtapes, Starlog, Lisa Frank, Yo! MTV Raps, Tiger Beat, Easy Bake Oven, The Day After, 
"Who Killed Laura Palmer?", Choose Your Own Adventure, Fighting Fantasy, wood paneling, the Cabbage Patch riots, 
the L.A. riots, the Care Bear stare, the Walkman, TV show theme songs, mall concerts, horse girls, Dungeon!, Headbangers Ball, 
Baby Jessica, Space Shuttle Challenger, Memphis Group design, Brookstone, record stores, The Joy of Painting, passing notes in class</em></p>"""
[character.description.notes]
  label = "Notes"


[character.attributes.style]
position = "left"
label = "Style"
type = "Text"

[character.attributes.takesyouback]
position = "left"
label = "Takes You Back"
type = "TextMany"
lines = 3


[character.attributes.conditions]
position = "top"
type = "TextMany"
label = "Conditions"
description = "When a Condition applies, take disadvantage"
lines = 3


[character.attributes.keyofthechild]
position = "top"
type = "ListMany"
label = "The Key of the Child"
description = "When you turn this Key, mark and narrate any of the below flashbacks that you wish."

[character.attributes.keyofthechild.options.routine]
label = "Home routine"
tooltip = "A flashback showing your latchkey kid routine whenever you got home from school."
[character.attributes.keyofthechild.options.outsider]
label = "Outsider"
tooltip = "A flashback showing how you were an outsider among your school peers."
[character.attributes.keyofthechild.options.parents]
label = "Imperfect parents"
tooltip = "A flashback to the moment when you realized your parents were imperfect."
[character.attributes.keyofthechild.options.happy]
label = "Genuine happiness"
tooltip = "A flashback to when you felt genuine happiness as a child."
[character.attributes.keyofthechild.options.trauma]
label = "Trauma"
tooltip = "A flashback to when you experienced childhood trauma."
[character.attributes.keyofthechild.options.growingup]
label = "Growing up"
tooltip = "A flashback to the moment when you realized childhood wasn't forever."
[character.attributes.keyofthechild.options.tvodyssey]
label = "TV Odyssey"
tooltip = "A flashback to when you first discovered TV Odyssey."


[character.attributes.keyofdesolation]
position = "top"
type = "ListMany"
label = "The Key of Desolation"
description = "When you turn this key, mark the first empty box."

[character.attributes.keyofdesolation.options.arch]
label = "THE SANDSTONE ARCH"
tooltip = "Unlock the Dawn question: 'Did you receive a Signal from the Other Side?'"
[character.attributes.keyofdesolation.options.well]
label = "THE FATHOMLESS WELL"
tooltip = "Your Reason modifier is reduced by 1 and your Sensitivity modifier is increased by 1 (max 3)."
[character.attributes.keyofdesolation.options.monolith]
label = "THE WANDERING MONOLITH"
tooltip = "Gain the Consult The Big Man Move."
[character.attributes.keyofdesolation.options.desert]
label = "THE CHROMATIC DESERT"
tooltip = """
    You can no longer be perceived by other characters and all memory of you is erased—it’s like you never existed.
    You can continue to conduct investigations, but the Clues you find are only available if you narrate them into an
    Odyssey tape scene."""
[character.attributes.keyofdesolation.options.signal]
label = "THE PURE-WHITE SIGNAL"
tooltip = "You lose contact with this world altogether. Tell the Keeper to play a white Odyssey tape and then retire this character."



[character.attributes.dawnquestions]
    position = "left"
    type = "ListMany"
    label = "Dawn questions"
    description = "The first is always marked. The second is always marked after it is unlocked. At the beginning of a session, mark two more (four total marked)."
    [character.attributes.dawnquestions.options.mystery]
        label = "Mystery solved"
        tooltip = "Did the Latchkeys resolve a mystery?"
    [character.attributes.dawnquestions.options.signal]
        label = "Signal from the Other Side"
        tooltip = "Did you receive a Signal from the Other Side? (locked until you mark THE SANDSTONE ARCH)"
    [character.attributes.dawnquestions.options.memory]
        label = "Good memory"
        tooltip = "Did you share a good memory from your childhood?"
    [character.attributes.dawnquestions.options.vulnerable]
        label = "Be vulnerable"
        tooltip = "Were you vulnerable with someone?"
    [character.attributes.dawnquestions.options.deeplake]
        label = "Deep Lake reconnection"
        tooltip = "Did you go out of your way to reconnect with Deep Lake?"
    [character.attributes.dawnquestions.options.monologue]
        label = "Chilling monologue"
        tooltip = "Did you deliver a chilling monologue about something that happened to you in the past?"
    [character.attributes.dawnquestions.options.cutloose]
        label = "Cut loose"
        tooltip = "Did you cut loose for once?"

[character.attributes.xp]
position = "left"
type = "Xp"
label = "XP Track"
description = "When you answer a Dawn question 'yes', or when a move says to, mark XP."
max = 6
default = 0

[character.attributes.advances]
position = "left"
type = "ListMany"
label = "Advances"
description = "When you Advance, pick any one."
options = [
    "Increase an ability by 1 (max 3).|2",
    "Choose an additional Latchkey muove.|2",
    "Write a custom Latchkey move for your character.",
    "Unmark all the items in Your Corner of the House."
]

# Define groups for moves.
[character.moveTypes]
basic = "Basic Moves"
class = "Latchkey Moves"
other = "Other Moves"

# Define groups for equipment.
[character.equipmentTypes]
housecorner = "Your corner of the house"
housecornermarked = "Your corner of the house (marked items)"

########################################
## NPCS ################################
########################################
# Define stats.
[npc]
[npc.attributesTop]
[npc.attributesTop.decription]
type = "LongText"
label = "Description"
[npc.attributesTop.quote]
type = "LongText"
label = "Quote"

# Define logical groups for moves.
[npc.moveTypes]
custom = "Moves"

[npc.equipmentTypes]
loot = "Loot"
